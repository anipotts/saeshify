name: CI
on:
  pull_request:
  push:
    branches: [main]
# A newer push to the same pull request cancels the older run. Main keeps
# every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_ROLE_KEY: test-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-worker-compat.mjs
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm cf:build
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker-dry-run
